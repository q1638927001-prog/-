name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-rootless:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xcode CLT & switch to full Xcode
        run: |
          set -e
          # macos-latest 自带 CLT；Theos 编译需要完整 Xcode（取系统 SDK + 完整 clang toolchain）
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
            xcodebuild -version
          fi

      - name: Install Theos (no SDK download, use system Xcode SDK)
        run: |
          set -e
          export REPO="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$REPO"
          cd "$REPO"
          # 预置 sdks/ 标记，让 install-theos 的 SDK 检查直接跳过
          # （不下载 patched SDK，改用系统 Xcode 自带 SDK）
          mkdir -p sdks
          touch sdks/.placeholder
          bash bin/install-theos
          echo "THEOS=$REPO" >> $GITHUB_ENV

      - name: Pre-cache SPM dependencies (Orion Runtime + other deps)
        run: |
          set -e
          export THEOS="$HOME/theos"
          make spm

      - name: Build & package (rootless)
        run: |
          set -e
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Collect debs
        run: |
          mkdir -p dist
          find . -name '*.deb' -not -path './.theos/*' -not -path './dist/*' -exec cp -f {} dist/ \;
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenkong120hz-rootless
          path: dist/