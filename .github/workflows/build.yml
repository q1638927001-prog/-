name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-rootless:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos (installer + submodules incl. Orion)
        run: |
          export REPO="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$REPO"
          (cd "$REPO" && bin/install-theos)

      - name: Build & package
        run: |
          export THEOS="$HOME/theos"
          make spm || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Collect debs
        run: |
          mkdir -p dist
          find . -name '*.deb' -not -path './.theos/*' -not -path './dist/*' -exec cp -f {} dist/ \;
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenkong120hz-rootless
          path: dist/