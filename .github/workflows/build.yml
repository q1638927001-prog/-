name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-rootless:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Switch to full Xcode & accept licenses
        run: |
          set -e
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          sudo xcodebuild -license accept || true
          xcodebuild -version

      - name: Clone Theos
        run: |
          set -e
          export REPO="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$REPO"
          cd "$REPO"
          git submodule update --init --recursive
          echo "THEOS=$REPO" >> $GITHUB_ENV

      - name: Install patched SDK
        run: |
          set -e
          export THEOS="$HOME/theos"
          for i in 1 2 3 4 5; do
            echo "=== SDK attempt $i ==="
            if "$THEOS/bin/install-sdk" latest; then
              echo "SDK OK on attempt $i"; exit 0
            fi
            echo "failed, wait 30s"; sleep 30
          done
          exit 1

      - name: Build & package
        run: |
          set -e
          export THEOS="$HOME/theos"
          export DISABLE_CODE_SIGNING=1
          make spm || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DISABLE_CODE_SIGNING=1

      - name: Collect debs
        run: |
          mkdir -p dist
          find . -name '*.deb' -not -path './.theos/*' -not -path './dist/*' -exec cp -f {} dist/ \;
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenkong120hz-rootless
          path: dist/